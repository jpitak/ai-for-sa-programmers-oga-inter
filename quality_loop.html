<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    @font-face { font-family: 'TH SarabunPSK'; src: url('/home/ubuntu/manus-slides/ai-for-sa-programmers-oga-intern-mugezvda-5919217d/assets/fonts/THSarabunPSK-Regular.ttf') format('truetype'); font-weight: 400; }
    @font-face { font-family: 'TH SarabunPSK'; src: url('/home/ubuntu/manus-slides/ai-for-sa-programmers-oga-intern-mugezvda-5919217d/assets/fonts/THSarabunPSK-Bold.ttf') format('truetype'); font-weight: 700; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { 
      width: 1280px; 
      min-height: 720px; 
      background: #F8F9FA; 
      display: flex; 
      flex-direction: column; 
      font-family: 'TH SarabunPSK', 'Sarabun', sans-serif;
      position: relative;
      padding: 48px;
    }
    .motif-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: #D4AF37;
    }
    .header {
      margin-bottom: 20px;
    }
    .slide-title {
      font-size: 26.6px;
      font-weight: 700;
      color: #1A2E46;
    }
    .diagram-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .step {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 4px solid #1A2E46;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      position: absolute;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .step-num { font-size: 24px; font-weight: 700; color: #D4AF37; }
    .step-en { font-size: 18px; font-weight: 700; color: #1A2E46; margin: 5px 0; }
    .step-th { font-size: 14px; color: #495057; }
    
    .s1 { top: 50px; left: 50%; transform: translateX(-50%); border-color: #1A2E46; }
    .s2 { top: 50%; right: 150px; transform: translateY(-50%); border-color: #D4AF37; }
    .s3 { bottom: 50px; left: 50%; transform: translateX(-50%); border-color: #8D99AE; }
    .s4 { top: 50%; left: 150px; transform: translateY(-50%); border-color: #343A40; }
    
    .arrow {
      position: absolute;
      font-size: 30px;
      color: #DEE2E6;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      font-size: 14px;
      color: #8D99AE;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="motif-line"></div>
    <div class="header">
      <h2 class="slide-title">The AI Quality Loop / วงจรการสร้างงานคุณภาพด้วย AI</h2>
    </div>
    <div class="diagram-area">
      <div class="step s1">
        <div class="step-num">01</div>
        <div class="step-en">DRAFT</div>
        <div class="step-th">ร่างงานครั้งแรกโดย AI ตามคำสั่ง (Prompt)</div>
      </div>
      <div class="step s2">
        <div class="step-num">02</div>
        <div class="step-en">VERIFY</div>
        <div class="step-th">ตรวจสอบความถูกต้องทางธุรกิจและตรรกะ</div>
      </div>
      <div class="step s3">
        <div class="step-num">03</div>
        <div class="step-en">REVISE</div>
        <div class="step-th">ปรับปรุงเนื้อหาด้วย AI หรือแก้ไขด้วยตนเอง</div>
      </div>
      <div class="step s4">
        <div class="step-num">04</div>
        <div class="step-en">APPROVE</div>
        <div class="step-th">อนุมัติและนำไปใช้งานจริงอย่างเป็นทางการ</div>
      </div>
    </div>
    <div class="footer">
      <div>OGA INTERNATIONAL | Business Solution</div>
      <div>Slide 09</div>
    </div>
  </div>
</body>
</html>
