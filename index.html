<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    @font-face { font-family: 'TH SarabunPSK'; src: url('/home/ubuntu/manus-slides/ai-for-sa-programmers-oga-intern-mugezvda-5919217d/assets/fonts/THSarabunPSK-Regular.ttf') format('truetype'); font-weight: 400; }
    @font-face { font-family: 'TH SarabunPSK'; src: url('/home/ubuntu/manus-slides/ai-for-sa-programmers-oga-intern-mugezvda-5919217d/assets/fonts/THSarabunPSK-Bold.ttf') format('truetype'); font-weight: 700; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { 
      width: 1280px; 
      min-height: 720px; 
      background: #1A2E46; 
      display: flex; 
      flex-direction: column; 
      font-family: 'TH SarabunPSK', 'Sarabun', sans-serif;
      position: relative;
      color: #FFFFFF;
      padding: 60px;
    }
    .motif-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: #D4AF37;
    }
    .content-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .main-title {
      font-size: 34.6px; /* 26 pt */
      font-weight: 700;
      color: #D4AF37;
      margin-bottom: 20px;
      line-height: 1.1;
    }
    .sub-title-th {
      font-size: 21.3px; /* 16 pt */
      font-weight: 400;
      margin-bottom: 40px;
    }
    .course-code {
      font-size: 24px;
      color: #8D99AE;
      margin-bottom: 60px;
      letter-spacing: 2px;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      width: 100%;
      align-items: flex-end;
    }
    .company-info {
      text-align: left;
    }
    .company-name {
      font-size: 24px;
      font-weight: 700;
      color: #D4AF37;
    }
    .dept-name {
      font-size: 20px;
      color: #FFFFFF;
    }
    .date-info {
      font-size: 18px;
      color: #8D99AE;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="motif-line"></div>
    <div class="content-center">
      <div class="course-code">AI TRAINING SERIES FOR PROFESSIONALS</div>
      <h1 class="main-title">AI for SA & Programmers</h1>
      <p class="sub-title-th">อบรมการนำ AI มาเพิ่มประสิทธิภาพในการทำงานสำหรับ SA และ Programmer</p>
    </div>
    <div class="footer">
      <div class="company-info">
        <div class="company-name">OGA INTERNATIONAL Co., Ltd.</div>
        <div class="dept-name">Business Solution Department</div>
      </div>
      <div class="date-info">2026 EDITION</div>
    </div>
  </div>
</body>
</html>
